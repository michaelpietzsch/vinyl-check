name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Python (ruff)
        run: ruff check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in vinylcheck/static/*.js; do node --check "$f"; done
      - name: Shell scripts
        run: bash -n deploy.sh
      - name: Documentation does not install from PyPI
        # no package is published there yet; a command that names one would fetch whatever someone registers
        run: |
          ! grep -rnE 'pip install "?vinyl-check' README.md docs site

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ml && ', torch' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        ml: [false]
        include:
          - { os: ubuntu-latest, python: "3.13", ml: true }
          - { os: macos-latest, python: "3.13", ml: false }
          - { os: windows-latest, python: "3.13", ml: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install PyTorch (CPU)
        if: matrix.ml
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("vinylcheck/static/index.html", "vinylcheck/static/i18n.js",
                         "vinylcheck/static/locales/en/meta.json", "vinylcheck/locales/en/common.json",
                         "vinylcheck/weights/grooveclean-detector.pt"):
              assert needed in names, f"missing in wheel: {needed}"
          print(f"{len(names)} files in wheel, all required assets present")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
