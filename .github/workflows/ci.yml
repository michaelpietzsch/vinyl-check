name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Python (ruff)
        run: ruff check .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in vinylcheck/static/*.js; do node --check "$f"; done
      - name: Shell scripts
        run: bash -n deploy.sh

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ml && ', torch' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        ml: [false]
        include:
          - { os: ubuntu-latest, python: "3.13", ml: true }
          - { os: macos-latest, python: "3.13", ml: false }
          - { os: windows-latest, python: "3.13", ml: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install PyTorch (CPU)
        if: matrix.ml
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("vinylcheck/static/index.html", "vinylcheck/static/i18n.js",
                         "vinylcheck/static/locales/en/meta.json", "vinylcheck/locales/en/common.json",
                         "vinylcheck/weights/grooveclean-detector.pt"):
              assert needed in names, f"missing in wheel: {needed}"
          print(f"{len(names)} files in wheel, all required assets present")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
