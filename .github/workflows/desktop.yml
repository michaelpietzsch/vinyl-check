name: Desktop apps

# Builds the desktop apps with PyInstaller (packaging/vinyl-check.spec), runs the self-test on the built apps and keeps
# them as workflow artifacts: the macOS disk image (Apple Silicon) and the Windows installer. On a version tag the two
# files are attached to the GitHub release, which release.yml creates; this workflow waits for it.
#
# The Windows installer contains PortAudio with ASIO support. It is only built and published once the repository
# variable WINDOWS_INSTALLER is "true": distributing ASIO support needs the signed Steinberg ASIO SDK licensing
# agreement (the SDK's other license, GPLv3, does not fit this project's license).
#
# Windows code signing is optional and off until it is configured (docs/code-signing.md): with the secret
# SIGNPATH_API_TOKEN set, the installer is signed through SignPath before it is published; without it, the unsigned
# installer is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace apps that are on the release already (a re-run builds them anew, with new digests)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[desktop]" pyinstaller
      - name: Version
        id: version
        run: |
          v=$(python -c "import vinylcheck; print(vinylcheck.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v"; exit 1
          fi
      - name: Build
        run: pyinstaller packaging/vinyl-check.spec --noconfirm
      - name: Self-test of the built app
        run: dist/vinyl-check.app/Contents/MacOS/vinyl-check --selftest --output selftest-macos.txt
      - name: Disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/macos/make-dmg.sh dist/vinyl-check.app "dist/vinyl-check-$VERSION-macos-arm64.dmg"
          {
            echo "### macOS"
            echo "- app: $(du -sh dist/vinyl-check.app | cut -f1), disk image: $(du -h dist/*.dmg | cut -f1)"
            echo '```'; cat selftest-macos.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: dist/vinyl-check-*-macos-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows installer (x64)
    if: vars.WINDOWS_INSTALLER == 'true'
    runs-on: windows-latest
    env:
      # Only used to decide whether the signing step runs; the action reads the secret itself
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[desktop]" pyinstaller
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(python -c "import vinylcheck; print(vinylcheck.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v"; exit 1
          fi
      - name: Build
        run: pyinstaller packaging/vinyl-check.spec --noconfirm
      - name: Self-test of the built app
        # A windowed program has no console: wait for it explicitly and read the result from the file
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\vinyl-check\vinyl-check.exe -ArgumentList '--selftest', '--output', 'selftest-windows.txt' -Wait -PassThru
          Get-Content selftest-windows.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\vinyl-check.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, self-test and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "dist\vinyl-check-$env:VERSION-windows-x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'vinyl-check-installed'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$dir", '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; exit 1 }
          $p = Start-Process -FilePath "$dir\vinyl-check.exe" -ArgumentList '--selftest', '--output', 'selftest-installed.txt' -Wait -PassThru
          Get-Content selftest-installed.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\vinyl-check.exe") { Write-Output '::error::The uninstaller left the program behind'; exit 1 }
          "### Windows`n- installer: $([math]::Round((Get-Item $setup).Length / 1MB)) MB`n``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content selftest-installed.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Keep the unsigned installer
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: dist/vinyl-check-*-windows-x64-setup.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'vinyl-check' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Choose the installer to publish
        shell: bash
        run: |
          mkdir -p dist/publish
          if ls dist/signed/*.exe >/dev/null 2>&1; then
            cp dist/signed/*.exe dist/publish/
            echo "- signed installer" >> "$GITHUB_STEP_SUMMARY"
          else
            cp dist/vinyl-check-*-windows-x64-setup.exe dist/publish/
            echo "- unsigned installer (no signing configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/publish/*.exe
          if-no-files-found: error

  publish:
    name: Attach to the GitHub release
    # the Windows job may be switched off (see above); the disk image is attached all the same
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.macos.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.windows.result)
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows.result == 'success'
        with:
          name: windows-installer
          path: assets
      - name: Wait for the release
        # release.yml runs the tests and creates the release; this workflow never creates it, so the two cannot race
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "::error::No release $GITHUB_REF_NAME after 30 minutes (did release.yml fail?). The apps are kept as artifacts of this run; re-run this job once the release exists."
          exit 1
      - name: Files to upload
        # A re-run on a tag builds the apps anew, with new digests. Apps that are on the release already stay as
        # they are unless the run was started with "replace": a changed digest on a download page looks like a
        # tampered file to whoever compares it.
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace == true }}
        run: |
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir -p upload
          for f in assets/*; do
            n=$(basename "$f")
            if [ "$REPLACE" != "true" ] && grep -qx -- "$n" <<< "$existing"; then
              echo "$n is on the release already and stays (start the workflow with 'replace' to replace it)"
            else
              cp "$f" upload/
            fi
          done
          echo "count=$(ls upload | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Checksums
        # release.yml wrote SHA256SUMS for the packages; lines of files uploaded here are replaced, then appended
        if: steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS || : > SHA256SUMS
          ls upload > names.txt
          awk 'NR == FNR { skip[$0] = 1; next } !($NF in skip)' names.txt SHA256SUMS > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          (cd upload && sha256sum *) >> SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.files.outputs.count != '0'
        with:
          subject-path: |
            upload/*
            SHA256SUMS
      - name: Upload
        if: steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" upload/* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
