name: Release

# Push a tag like v1.0.0 to build the packages and publish a GitHub release with them. The build job runs with
# read-only permissions; only the publish job may write (the release), and it attests what it publishes: build
# provenance for every file, verifiable with `gh attestation verify <file> --repo <owner>/<repo>`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Tag matches package version
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('vinylcheck/__init__.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else f"vinyl-check {version}"
          # The desktop apps are attached by desktop.yml a few minutes after this release is created
          notes += ("\n\n### Desktop apps\n\nThe desktop apps are attached a few minutes after this release is "
                    "published. They are not signed yet: see "
                    "[Code signing](https://github.com/michaelpietzsch/vinyl-check/blob/main/docs/code-signing.md) "
                    "for the first start and for checking a download.")
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Checksums
        run: (cd dist && sha256sum *) > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY"
          --title "vinyl-check ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
