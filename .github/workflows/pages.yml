name: Website

# Builds the project website (landing page, download page with sizes and SHA256 checksums, download.json) from the
# GitHub releases and publishes it on GitHub Pages. Pages needs a public repository (or a paid plan); while the
# repository is private the site is only built, so the workflow stays green.
on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "vinylcheck/static/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Build the site from the releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py --repo "${{ github.repository }}" --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
